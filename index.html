<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Multi-QR Scanner</title>
<style>
  :root {
    --bg: #0d1013;
    --panel: #171b1f;
    --line: #2a2f35;
    --text: #e8eaed;
    --text-dim: #8a9098;
    --read: #22c55e;
    --unread: #ef4444;
    --accent: #2f81f7;
    --accent-2: #d99a2f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #camera, #overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
  }
  #camera { object-fit: contain; }
  #overlay { pointer-events: none; }

  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px));
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    z-index: 10;
    pointer-events: none;
  }
  #recordedCount { font-size: 20px; font-weight: 600; }
  #recordedCount span { color: var(--accent); }
  #statusMsg { font-size: 13px; color: var(--text-dim); max-width: 60%; text-align: right; }

  #controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 12px;
    align-items: stretch;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    z-index: 10;
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #btnRead {
    flex: 1.4;
    background: var(--accent);
    color: #fff;
    font-size: 19px;
    padding: 18px 0;
  }
  #btnRead:active { filter: brightness(0.85); }
  #btnExport, #btnClear {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 16px;
    padding: 18px 0;
  }
  #btnExport.active { background: var(--accent-2); color: #1a1200; border-color: var(--accent-2); }
  #btnExport:active, #btnClear:active { filter: brightness(1.2); }

  #exportPanel {
    position: absolute;
    inset: 0;
    background: rgba(10, 12, 14, 0.96);
    z-index: 20;
    display: none;
    flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  #exportPanel.visible { display: flex; }
  #exportPanel h2 {
    font-size: 18px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  #exportPanel p.sub { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }
  #exportList {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .export-row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .export-row .idx {
    color: var(--read);
    font-weight: 700;
    min-width: 24px;
  }
  .export-row .data {
    word-break: break-all;
    font-size: 14px;
  }
  #exportEmpty { color: var(--text-dim); font-size: 14px; padding: 20px 0; }
  #exportClose {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 14px 0;
    font-size: 15px;
  }

  #permissionGate {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px; text-align: center;
    gap: 16px; z-index: 30;
  }
  #permissionGate h1 { font-size: 20px; margin: 0; }
  #permissionGate p { color: var(--text-dim); font-size: 14px; line-height: 1.5; margin: 0; max-width: 320px; }
  #permissionGate button {
    background: var(--accent); color: #fff; padding: 14px 28px; font-size: 16px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="topbar">
    <div id="recordedCount">Recorded: <span id="recordedNum">0</span></div>
    <div id="statusMsg"></div>
  </div>

  <div id="controls">
    <button id="btnRead">Read</button>
    <button id="btnExport">Export</button>
    <button id="btnClear">Clear</button>
  </div>

  <div id="exportPanel">
    <h2>Recorded QR data</h2>
    <p class="sub">เรียงตามลำดับที่ Read — แตะ Export อีกครั้งเพื่อปิด</p>
    <div id="exportList"></div>
    <div id="exportEmpty" class="hidden">ยังไม่มีข้อมูลที่บันทึก</div>
    <button id="exportClose">ปิด</button>
  </div>

  <div id="permissionGate">
    <h1>Multi-QR Scanner</h1>
    <p id="gateText">แตะปุ่มด้านล่างเพื่อขอสิทธิ์ใช้กล้อง แล้วเล็งกล้องไปที่ QR code ของกล่องงาน</p>
    <button id="btnStart">เปิดกล้อง</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
